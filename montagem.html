<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f5c55">
<title>3D da obra</title>
<!--
  Página do MONTADOR do Ardus (17/10/2026; recursos do Intmob em 18/10/2026).
  O Ardus publica, junto com as etiquetas, o 3D da obra (GLB) com o pacote da
  montagem nos extras: módulos, ordem de instalação, etapas, as peças com o
  código impresso na etiqueta e, em cada malha, nome, camada e dono (ferragem).
  A página pergunta `montagem_publica(id)` (SQL v19) e abre o modelo.
  Recursos: cartão da peça no alto, toque seleciona a peça, Raio-X, vista
  explodida, camadas (frentes, internos, caixa, fundos, ferragens, furos,
  legendas), Estrutura (Peças / Módulos / Projeto, com filtro e o olho de cada
  item), centralizar, vista de cima, montagem animada e vista inicial.
  ⚠️ A chave abaixo é a PUBLICÁVEL. Gerado por scripts/gerar-visualizador.mjs.
  ⚠️ Nada vindo do servidor vira HTML: tudo por textContent.
  ⚠️ Sem animação contínua: redesenha só quando algo muda (a explosão e a
  montagem animada rodam quadros só enquanto andam).
-->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"
} }
</script>
<style>
  :root { --fundo: #f4f6f5; --painel: #ffffff; --texto: #1d2a28; --suave: #4f5d5a; --marca: #0f5c55; --borda: #d6dedb;
          --destaque: #d93a3f; --etapa: #0f766e; --sombra: 0 -6px 24px rgba(0,0,0,.12); --vidro: rgba(255,255,255,.92); }
  @media (prefers-color-scheme: dark) { :root { --fundo: #121816; --painel: #1a2220; --texto: #e7eeec; --suave: #a9b8b4; --marca: #3fb3a6; --borda: #2a3532;
          --sombra: 0 -6px 24px rgba(0,0,0,.5); --vidro: rgba(26,34,32,.94); } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fundo); color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--borda); background: var(--painel); flex: none; }
  header img { height: 30px; max-width: 96px; object-fit: contain; display: none; }
  header .titulos { min-width: 0; flex: 1; }
  header .empresa { font-size: 12px; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header h1 { font-size: 16px; margin: 1px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  main { flex: 1; position: relative; min-height: 0; overflow: hidden; }
  canvas#palco3d { width: 100%; height: 100%; display: block; touch-action: none; }
  .barra { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--painel); border-top: 1px solid var(--borda); flex: none; }
  .barra button { flex: 1; min-height: 46px; border-radius: 12px; border: 1px solid var(--borda); background: var(--painel); color: var(--texto); font: inherit; font-size: 14px; font-weight: 600; }
  .barra button.principal { background: var(--marca); border-color: var(--marca); color: #fff; flex: 1.4; }
  .barra button[aria-pressed="true"] { border-color: var(--marca); color: var(--marca); }

  /* Cartão da peça no alto (como o do Intmob) */
  .hud { position: absolute; top: 8px; left: 10px; right: 10px; display: none; align-items: center; gap: 10px; padding: 9px 12px;
    background: var(--vidro); border: 1px solid var(--borda); border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.10); }
  .hud.aberto { display: flex; }
  .hud .tag { flex: none; font-weight: 800; font-size: 13px; color: #fff; background: var(--destaque); border-radius: 8px; padding: 4px 7px; }
  .hud .meio { flex: 1; min-width: 0; }
  .hud .cod { font-size: 12px; color: var(--marca); font-weight: 700; letter-spacing: .03em; }
  .hud .nome { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hud .mat { font-size: 12px; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hud button { flex: none; border: 1px solid var(--borda); background: var(--painel); color: var(--texto); border-radius: 10px; min-height: 36px; padding: 0 10px; font: inherit; font-size: 13px; font-weight: 600; }
  .hud .x { border: 0; background: transparent; color: var(--suave); font-size: 20px; padding: 0 4px; }

  /* Botões redondos (canto de baixo) */
  .redondos { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 8px; }
  .redondos button { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--marca); color: #fff; display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 10px rgba(0,0,0,.18); }
  .redondos button[aria-pressed="true"] { background: var(--destaque); }
  .redondos svg { width: 22px; height: 22px; }
  main.com-cartao .redondos { display: none; }

  .rotulos { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .rotulo { position: absolute; transform: translate(-50%, -50%); font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px;
    background: var(--vidro); border: 1px solid var(--borda); white-space: nowrap; color: var(--texto); }
  .rotulo.sel { background: var(--destaque); border-color: var(--destaque); color: #fff; }

  /* Folha de baixo */
  .cartao { position: absolute; left: 0; right: 0; bottom: 0; max-height: 62%; overflow: auto; background: var(--painel); border-top-left-radius: 16px; border-top-right-radius: 16px;
    box-shadow: var(--sombra); padding: 14px 16px 16px; display: none; overflow-x: hidden; }
  .cartao.aberto { display: block; }
  .cartao .fechar { position: sticky; top: 0; float: right; border: 0; background: transparent; color: var(--suave); font-size: 22px; line-height: 1; padding: 0 0 6px 10px; }
  .cartao h2 { font-size: 17px; margin: 0 0 4px; overflow-wrap: anywhere; }
  .cartao h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--suave); margin: 14px 0 6px; }
  .cartao .sub { font-size: 13px; color: var(--suave); margin: 0 0 8px; line-height: 1.4; }
  .pilha { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .pilha button { border: 1px solid var(--borda); background: var(--fundo); color: var(--texto); border-radius: 999px; padding: 8px 12px; font: inherit; font-size: 13px; min-height: 38px; }
  .pilha button.ativo, .pilha button[aria-pressed="true"] { background: var(--etapa); border-color: var(--etapa); color: #fff; font-weight: 600; }
  .seg { display: flex; border: 1px solid var(--borda); border-radius: 999px; padding: 3px; gap: 3px; margin: 4px 0; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--texto); border-radius: 999px; min-height: 38px; font: inherit; font-size: 14px; font-weight: 600; }
  .seg button[aria-pressed="true"] { background: var(--marca); color: #fff; }
  .linha { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--borda); font-size: 14px; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; color: inherit; text-align: left; font-family: inherit; }
  .linha:last-child { border-bottom: 0; }
  .linha .n { min-width: 44px; height: 30px; border-radius: 8px; background: var(--marca); color: #fff; font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; flex: none; padding: 0 6px; }
  .linha .t { flex: 1; min-width: 0; }
  .linha .t b { display: block; font-size: 14px; }
  .linha .t span { display: block; font-size: 12px; color: var(--suave); overflow-wrap: anywhere; }
  .no { display: flex; align-items: center; gap: 4px; min-height: 42px; border-bottom: 1px solid var(--borda); }
  .no .olho, .no .seta { flex: none; width: 38px; height: 38px; border: 0; background: transparent; color: var(--suave); display: inline-flex; align-items: center; justify-content: center; }
  .no .olho svg, .no .seta svg { width: 20px; height: 20px; }
  .no .olho[aria-pressed="false"] { color: var(--borda); }
  .no .rot { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--texto); text-align: left; font: inherit; font-size: 14px; padding: 8px 4px; }
  .no .rot small { display: block; color: var(--suave); font-size: 12px; overflow-wrap: anywhere; }
  .no.oculto .rot { color: var(--suave); }
  .no.sel .rot { color: var(--destaque); font-weight: 700; }
  .filhos { padding-left: 26px; }
  .peca-destaque { border-left: 4px solid var(--destaque); padding-left: 10px; margin: 6px 0 10px; }
  .peca-destaque .cod { font-size: 12px; color: var(--suave); letter-spacing: .04em; }
  .grade { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; font-size: 14px; margin: 6px 0 10px; }
  .grade dt { color: var(--suave); } .grade dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
  .acao { border: 1px solid var(--marca); color: var(--marca); background: transparent; border-radius: 10px; padding: 10px 14px; font: inherit; font-weight: 600; font-size: 14px; min-height: 44px; }
  .aviso-peq { font-size: 12.5px; color: var(--suave); background: var(--fundo); border-radius: 8px; padding: 8px 10px; margin: 6px 0; }
  .busca { display: flex; gap: 8px; margin: 6px 0 8px; }
  .busca input { flex: 1; min-height: 44px; border: 1px solid var(--borda); border-radius: 10px; padding: 0 12px; font: inherit; font-size: 16px; background: var(--fundo); color: var(--texto); }
  .camera { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; z-index: 10; }
  .camera.aberto { display: flex; }
  .camera video { flex: 1; width: 100%; object-fit: cover; min-height: 0; }
  .camera .mira { position: absolute; left: 50%; top: 42%; width: 64vw; max-width: 300px; aspect-ratio: 1; transform: translate(-50%, -50%); border: 3px solid rgba(255,255,255,.85); border-radius: 18px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.35); pointer-events: none; }
  .camera .rodape { padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); color: #fff; text-align: center; font-size: 14px; display: flex; flex-direction: column; gap: 10px; }
  .camera .rodape button { min-height: 46px; border-radius: 12px; border: 0; font: inherit; font-weight: 600; font-size: 15px; }
  .aviso { max-width: 420px; margin: 16vh auto 0; padding: 0 20px; text-align: center; }
  .aviso h2 { font-size: 18px; margin: 0 0 8px; } .aviso p { color: var(--suave); line-height: 1.5; margin: 0; }
  .progresso { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); color: var(--suave); font-size: 14px; text-align: center; }
  .dica { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--suave); background: var(--vidro);
    padding: 5px 12px; border-radius: 999px; pointer-events: none; white-space: nowrap; }
  :focus-visible { outline: 3px solid var(--destaque); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <img id="logo" alt="">
  <div class="titulos">
    <div class="empresa" id="empresa"></div>
    <h1 id="projeto">Carregando…</h1>
  </div>
</header>
<main id="palco">
  <canvas id="palco3d" aria-label="Projeto em 3D"></canvas>
  <div class="rotulos" id="rotulos" aria-hidden="true"></div>
  <div class="progresso" id="progresso">Carregando a obra…</div>
  <div class="dica" id="dica" hidden>Toque numa peça · arraste para girar · pince para aproximar</div>
  <div class="hud" id="hud" aria-live="polite">
    <span class="tag">3D</span>
    <div class="meio">
      <div class="cod" id="hud-cod"></div>
      <div class="nome" id="hud-nome"></div>
      <div class="mat" id="hud-mat"></div>
    </div>
    <button type="button" id="hud-info">Detalhes</button>
    <button type="button" class="x" id="hud-x" aria-label="Tirar a seleção">×</button>
  </div>
  <div class="redondos" id="redondos" hidden>
    <button type="button" id="r-centro" aria-label="Centralizar" title="Centralizar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
    <button type="button" id="r-cima" aria-label="Vista de cima" title="Vista de cima">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 10v10"/></svg>
    </button>
    <button type="button" id="r-play" aria-label="Montagem animada" title="Montagem animada" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button type="button" id="r-inicio" aria-label="Vista inicial" title="Vista inicial">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 11 12 4l8 7v9H4z"/><path d="M10 20v-5h4v5"/></svg>
    </button>
  </div>
  <section class="cartao" id="cartao" aria-live="polite"></section>
</main>
<nav class="barra" id="barra" hidden>
  <button type="button" class="principal" id="b-ler">Ler etiqueta</button>
  <button type="button" id="b-exibicao" aria-pressed="false">Exibição</button>
  <button type="button" id="b-estrutura" aria-pressed="false">Estrutura</button>
</nav>
<div class="camera" id="camera" role="dialog" aria-label="Ler o QR da etiqueta">
  <video id="video" playsinline muted></video>
  <div class="mira"></div>
  <div class="rodape">
    <div id="camera-texto">Aponte para o QR da etiqueta da peça</div>
    <button type="button" id="b-fechar-camera">Fechar</button>
  </div>
</div>
<script type="module">
  import * as THREE from 'three'
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js'

  const SUPABASE_URL = 'https://uqakyepxfptojkscdesw.supabase.co'
  const CHAVE_PUBLICAVEL = 'sb_publishable_DnY55ncsxYCOqTEyeVV1UQ_plEGPPpf'
  const $ = (id) => document.getElementById(id)
  const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i
  // O mesmo padrão do código PROG da conferência de expedição (ConferenciaDeExpedicao.lerCodigo).
  const lerCodigo = (t) => { const m = String(t || '').toUpperCase().replace(/\s+/g, '').match(/[A-Z]{2,4}\d{4,6}[A-Z]{1,3}/); return m ? m[0] : '' }
  const NIVEL = { piso: 'No piso', pendurado: 'Pendurado', apoiado: 'Sobre outro módulo' }
  const CLASSES_PADRAO = [
    { id: 'frente', nome: 'Frentes' }, { id: 'interno', nome: 'Internos' }, { id: 'caixa', nome: 'Caixa' },
    { id: 'fundo', nome: 'Fundos' }, { id: 'ferragem', nome: 'Ferragens' }, { id: 'complemento', nome: 'Complementos' },
  ]
  const ehModulo = (nome) => /^mod_\d+$/.test(nome || '')
  const ehPeca = (nome) => /^p_\d+_\d+$/.test(nome || '')

  /** Cria elemento sem HTML: tudo por textContent. */
  function el(tag, props = {}, filhos = []) {
    const e = document.createElement(tag)
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue
      if (k === 'texto') e.textContent = v
      else if (k === 'classe') e.className = v
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v)
      else e.setAttribute(k, v === true ? '' : v)
    }
    for (const f of [].concat(filhos)) if (f) e.append(f)
    return e
  }
  // Ícones de traço montados por DOM (sem HTML de fora).
  const NS = 'http://www.w3.org/2000/svg'
  function icone(caminhos) {
    const s = document.createElementNS(NS, 'svg')
    s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor')
    s.setAttribute('stroke-width', '2'); s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round')
    for (const d of caminhos) { const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); s.append(p) }
    return s
  }
  const OLHO = ['M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z', 'M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z']
  const OLHO_FECHADO = ['M3 3l18 18', 'M10.6 6.1A10 10 0 0 1 12 6c6.5 0 10 6 10 6a17 17 0 0 1-3.2 3.9M6.6 6.6A17 17 0 0 0 2 12s3.5 6 10 6a9.8 9.8 0 0 0 4.4-1']
  const SETA_D = ['M9 6l6 6-6 6'], SETA_B = ['M6 9l6 6 6-6']

  function aviso(titulo, texto) {
    $('projeto').textContent = titulo
    $('progresso')?.remove()
    $('palco').replaceChildren(el('div', { classe: 'aviso' }, [el('h2', { texto: titulo }), el('p', { texto })]))
  }

  // ─── 3D (redesenha só quando algo muda: nada de animação contínua) ───
  const canvas = $('palco3d')
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true })
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2))
  renderer.outputColorSpace = THREE.SRGBColorSpace
  const cena = new THREE.Scene()
  const escuro = matchMedia('(prefers-color-scheme: dark)').matches
  cena.background = new THREE.Color(escuro ? 0x121816 : 0xf4f6f5)
  cena.add(new THREE.HemisphereLight(0xffffff, 0x8a8f8c, 2.2))
  const sol = new THREE.DirectionalLight(0xffffff, 1.6); sol.position.set(3, 6, 4); cena.add(sol)
  const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 200)
  const controles = new OrbitControls(camera, canvas)
  controles.enableDamping = false
  let pedido = false
  const desenhar = () => { if (pedido) return; pedido = true; requestAnimationFrame(() => { pedido = false; renderer.render(cena, camera); desenharRotulos() }) }
  controles.addEventListener('change', desenhar)
  function ajustar() {
    const r = canvas.getBoundingClientRect()
    renderer.setSize(r.width, r.height, false)
    camera.aspect = r.width / Math.max(1, r.height); camera.updateProjectionMatrix(); desenhar()
  }
  addEventListener('resize', ajustar)

  let D = null, raiz = null
  const porNome = new Map()       // nome do nó -> objeto
  const original = new Map()      // malha -> material do arquivo
  const info = new Map()          // nome da malha -> { mod, nome, cl, dono, peca }
  const pecaDoNo = new Map()      // nome da malha -> peça com etiqueta
  const malhasDoModulo = new Map() // mod -> [malha]

  // Materiais da tela (um por papel, compartilhados)
  const mat = (cor, op, extra = {}) => new THREE.MeshBasicMaterial({ color: cor, transparent: op < 1, opacity: op, depthWrite: op >= 1, ...extra })
  const fantasma = mat(escuro ? 0x7c8a87 : 0x9aa6a3, 0.10)
  const selecao = new THREE.MeshStandardMaterial({ color: 0xd93a3f, emissive: 0x5a0d10, roughness: 0.5 })
  const montada = new THREE.MeshStandardMaterial({ color: 0xc4c9c7, roughness: 0.8 })
  const RAIOX = {
    frente: mat(0x4f8fe0, 0.22), interno: mat(escuro ? 0x8fa3b8 : 0x7f95ab, 0.16), caixa: mat(escuro ? 0xb8c2c0 : 0xd2d9d7, 0.12),
    fundo: mat(escuro ? 0xb8c2c0 : 0xd2d9d7, 0.08), ferragem: new THREE.MeshStandardMaterial({ color: 0x6b7378, roughness: 0.6 }),
    complemento: mat(0xc9a86a, 0.16),
  }
  const corAresta = new THREE.LineBasicMaterial({ color: escuro ? 0xc9d3d0 : 0x2b3533, transparent: true, opacity: escuro ? 0.55 : 0.6 })

  // ─── estado da tela ───
  const E = {
    modo: 'solido',            // 'solido' | 'raiox'
    explodido: false,
    camadas: { frente: true, interno: true, caixa: true, fundo: true, ferragem: true, complemento: true, furos: false, rotulos: false },
    ocultos: new Set(),        // nomes de módulo (mod_i) ou peça (p_i_k) apagados no olho
    foco: null,                // null | { mod } | { mod, etapa }
    sel: [],                   // malhas selecionadas (nomes)
    selMod: null, selPeca: null,
    ateModulo: null,           // montagem animada do projeto: índice do último módulo à vista
  }

  function todasAsMalhas(o, f) { o.traverse((m) => { if (m.isMesh && ehPeca(m.name)) f(m) }) }
  function moduloDe(obj) { let o = obj; while (o && !ehModulo(o.name)) o = o.parent; return o }
  const modDoObj = (o) => { const m = moduloDe(o); return m ? D.modulos.find((x) => x.no === m.name) : null }

  /** Arestas (Raio-X): criadas na 1ª vez que pedem, filhas da malha. */
  let comArestas = false
  function criarArestas() {
    if (comArestas) return
    comArestas = true
    todasAsMalhas(raiz, (m) => {
      try {
        const l = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry, 25), corAresta)
        l.userData.aresta = true; l.raycast = () => {}
        m.add(l)
      } catch { /* geometria sem arestas */ }
    })
  }

  /** Aplica o estado a cada malha: visibilidade, material e arestas. */
  function aplicar() {
    if (!raiz) return
    const foco = E.foco
    const ordemVis = E.ateModulo
    for (const [nome, i] of info) {
      const m = porNome.get(nome); if (!m) continue
      let vis = E.camadas[i.cl] !== false && !E.ocultos.has(nome) && !E.ocultos.has(i.mod.no)
      if (vis && i.dono && E.ocultos.has(i.dono)) vis = false
      if (vis && ordemVis != null && (i.mod._idx ?? 0) > ordemVis) vis = false
      let material = original.get(m)
      if (E.modo === 'raiox') material = RAIOX[i.cl] || RAIOX.caixa
      // Fora do módulo em foco (ou do módulo da peça escolhida): segundo plano.
      const outro = (foco && foco.mod !== i.mod) || (!foco && E.selMod && E.selMod !== i.mod)
      if (outro) material = fantasma
      if (foco && foco.mod === i.mod && foco.etapa != null) {
        const e = i.etapa
        if (e != null && e > foco.etapa) vis = false
        else if (e != null && e < foco.etapa) material = E.modo === 'raiox' ? material : montada
      }
      if (E.sel.includes(nome)) { material = selecao; vis = true }
      else if (E.sel.length && E.modo !== 'raiox' && (!foco || foco.mod === i.mod)) {
        // Com uma peça escolhida, o resto do módulo dela fica de vidro (o raio-X do Intmob).
        if (E.selMod === i.mod) material = RAIOX[i.cl] || fantasma
      }
      m.material = material
      m.visible = vis
      for (const c of m.children) if (c.userData?.aresta) c.visible = vis && !outro && (E.modo === 'raiox' || (E.sel.length > 0 && E.selMod === i.mod))
    }
    // Furos: camada à parte, por módulo.
    for (const mod of D.modulos) {
      const g = mod.furos?.no ? porNome.get(mod.furos.no) : null
      if (!g) continue
      g.visible = E.camadas.furos && !E.ocultos.has(mod.no) && !E.explodido && (!E.foco || E.foco.mod === mod) && (!E.selMod || E.selMod === mod || !!E.foco)
        && (ordemVis == null || (mod._idx ?? 0) <= ordemVis)
    }
    desenhar()
  }

  function enquadrar(objs, { deCima = false } = {}) {
    const caixa = new THREE.Box3()
    for (const o of objs) if (o) caixa.expandByObject(o)
    if (caixa.isEmpty()) return
    const c = caixa.getCenter(new THREE.Vector3()), s = caixa.getSize(new THREE.Vector3())
    const raio = Math.max(s.x, s.y, s.z) * 0.75 + 0.15
    const dist = raio / Math.tan((camera.fov * Math.PI / 180) / 2)
    let dir = camera.position.clone().sub(controles.target).normalize()
    if (!Number.isFinite(dir.x) || dir.lengthSq() < 0.5) dir.set(0.6, 0.55, 0.6).normalize()
    if (deCima) dir = new THREE.Vector3(0, 1, 0.0008).normalize()
    controles.target.copy(c)
    camera.position.copy(c).add(dir.multiplyScalar(dist))
    camera.near = Math.max(0.005, dist / 200); camera.far = dist * 50; camera.updateProjectionMatrix()
    controles.update(); desenhar()
  }
  const objsDaSelecao = () => E.sel.map((n) => porNome.get(n)).filter(Boolean)
  function centralizar() {
    if (E.sel.length) enquadrar(E.selMod ? [porNome.get(E.selMod.no)] : objsDaSelecao())
    else if (E.foco) enquadrar([porNome.get(E.foco.mod.no)])
    else enquadrar([raiz])
  }

  // ─── vista explodida (anda alguns quadros e para) ───
  const explosao = new Map() // malha -> { base: Vector3, desloca: Vector3 }
  function prepararExplosao() {
    if (explosao.size) return
    raiz.updateMatrixWorld(true)
    const centro = new THREE.Vector3(), c = new THREE.Vector3()
    const deslocDoNo = new Map()
    const calcular = (m, i) => {
      new THREE.Box3().setFromObject(porNome.get(i.mod.no)).getCenter(centro)
      new THREE.Box3().setFromObject(m).getCenter(c)
      return c.clone().sub(centro).multiplyScalar(0.7)
    }
    for (const [nome, i] of info) if (!i.dono) { const m = porNome.get(nome); if (m) deslocDoNo.set(nome, calcular(m, i)) }
    for (const [nome, i] of info) {
      const m = porNome.get(nome); if (!m || !m.parent) continue
      const mundo = (i.dono && deslocDoNo.get(i.dono)) || deslocDoNo.get(nome) || calcular(m, i)
      new THREE.Box3().setFromObject(m).getCenter(c)
      const a = m.parent.worldToLocal(c.clone()), b = m.parent.worldToLocal(c.clone().add(mundo))
      explosao.set(m, { base: m.position.clone(), desloca: b.sub(a) })
    }
  }
  let t = 0, animando = null
  function explodir(ligar) {
    prepararExplosao()
    E.explodido = ligar
    const alvo = ligar ? 1 : 0, inicio = performance.now(), de = t
    cancelAnimationFrame(animando)
    const passo = (agora) => {
      const f = Math.min(1, (agora - inicio) / 420)
      t = de + (alvo - de) * (f < 0.5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2)
      for (const [m, v] of explosao) m.position.copy(v.base).addScaledVector(v.desloca, t)
      renderer.render(cena, camera); desenharRotulos()
      if (f < 1) animando = requestAnimationFrame(passo); else { aplicar(); centralizar() }
    }
    aplicar()
    animando = requestAnimationFrame(passo)
  }

  // ─── legendas sobre as peças (só as visíveis e no máximo 60) ───
  const camadaRot = $('rotulos')
  const v3 = new THREE.Vector3()
  function desenharRotulos() {
    if (!raiz || !E.camadas.rotulos) { if (camadaRot.childElementCount) camadaRot.replaceChildren(); return }
    const r = canvas.getBoundingClientRect()
    const itens = []
    const emUmModulo = E.foco || E.selMod
    if (!emUmModulo) {
      for (const mod of D.modulos) {
        const o = porNome.get(mod.no); if (!o || E.ocultos.has(mod.no)) continue
        new THREE.Box3().setFromObject(o).getCenter(v3)
        itens.push({ p: v3.clone(), texto: rotMod(mod), sel: false })
      }
    } else {
      const mod = E.foco?.mod || E.selMod
      for (const m of malhasDoModulo.get(mod) || []) {
        if (!m.visible) continue
        const i = info.get(m.name); if (!i || i.cl === 'ferragem') continue
        const p = pecaDoNo.get(m.name)
        new THREE.Box3().setFromObject(m).getCenter(v3)
        itens.push({ p: v3.clone(), texto: p?.c || i.nome || '', sel: E.sel.includes(m.name) })
      }
    }
    const fora = []
    for (const it of itens.slice(0, 60)) {
      if (!it.texto) continue
      it.p.project(camera)
      if (it.p.z > 1 || Math.abs(it.p.x) > 1.05 || Math.abs(it.p.y) > 1.05) continue
      const e = el('span', { classe: it.sel ? 'rotulo sel' : 'rotulo', texto: it.texto })
      e.style.left = `${((it.p.x + 1) / 2) * r.width}px`; e.style.top = `${((1 - it.p.y) / 2) * r.height}px`
      fora.push(e)
    }
    camadaRot.replaceChildren(...fora)
  }

  // ─── seleção e cartão no alto ───
  const nomeEtapa = (n) => D?.etapas?.find((e) => e.n === Number(n))?.nome || 'Complementos'
  const rotMod = (m) => (m.n != null ? `M${m.n}` : '—')
  const nomeMod = (m) => (m.n != null ? `M${m.n} · ${m.nome}` : m.nome)
  const medida = (p) => (p.med || []).map((v) => String(Math.round(v * 10) / 10).replace('.', ',')).join(' × ')
  const medidaDaMalha = (mod, no) => {
    const x = (mod.malhas || []).find((k) => k.no === no)
    if (!x) return ''
    return [...x.dims].map((v) => Math.round(v)).sort((a, b) => b - a).join(' × ')
  }

  function selecionarMalha(nome) {
    const i = info.get(nome); if (!i) return
    // Ferragem seleciona a peça dona (a etiqueta é da peça).
    const alvo = i.cl === 'ferragem' && i.dono ? i.dono : nome
    const p = pecaDoNo.get(alvo)
    const nos = p ? (p.nos || [alvo]) : [alvo]
    selecionar(i.mod, nos, p, alvo)
  }
  function selecionar(mod, nos, peca, noBase) {
    criarArestas()
    E.sel = nos.filter((n) => porNome.has(n)); E.selMod = mod; E.selPeca = peca || null
    const i = info.get(noBase || E.sel[0])
    const med = peca ? `${medida(peca)} mm` : (medidaDaMalha(mod, noBase || E.sel[0]) ? `${medidaDaMalha(mod, noBase || E.sel[0])} mm` : '')
    $('hud-cod').textContent = peca ? `Peça ${peca.c}` : 'Peça sem etiqueta'
    $('hud-nome').textContent = peca?.nome || i?.nome || 'Peça'
    $('hud-mat').textContent = [nomeMod(mod), peca?.mat, med].filter(Boolean).join(' · ')
    $('hud').classList.add('aberto')
    $('hud-info').onclick = () => cartaoDaPeca(mod, peca, [], noBase)
    aplicar()
  }
  function tirarSelecao() { E.sel = []; E.selMod = null; E.selPeca = null; $('hud').classList.remove('aberto'); aplicar() }
  $('hud-x').addEventListener('click', tirarSelecao)

  // ─── folha de baixo ───
  const cartao = $('cartao')
  // Com a folha aberta, o desenho sobe: o móvel fica na metade de cima da tela.
  function folga(aberto) {
    const r = canvas.getBoundingClientRect()
    if (aberto) camera.setViewOffset(r.width, r.height, 0, r.height * 0.24, r.width, r.height)
    else camera.clearViewOffset()
    camera.updateProjectionMatrix(); desenhar()
  }
  let folhaAtual = null
  function abrirCartao(filhos, qual = null) {
    folhaAtual = qual
    cartao.replaceChildren(el('button', { classe: 'fechar', type: 'button', 'aria-label': 'Fechar', texto: '×', onclick: fecharCartao }), ...filhos)
    cartao.classList.add('aberto'); cartao.scrollTop = 0
    $('palco').classList.add('com-cartao')
    $('b-exibicao').setAttribute('aria-pressed', String(qual === 'exibicao'))
    $('b-estrutura').setAttribute('aria-pressed', String(qual === 'estrutura'))
    folga(true)
  }
  function fecharCartao() {
    folhaAtual = null
    cartao.classList.remove('aberto'); $('palco').classList.remove('com-cartao')
    $('b-exibicao').setAttribute('aria-pressed', 'false'); $('b-estrutura').setAttribute('aria-pressed', 'false')
    folga(false)
  }

  function cartaoDoModulo(mod, etapa = null) {
    E.foco = { mod, etapa }
    aplicar(); enquadrar([porNome.get(mod.no)])
    const etapas = Object.keys(mod.etapas || {}).map(Number).sort((a, b) => a - b)
    const pilha = el('div', { classe: 'pilha', role: 'group', 'aria-label': 'Passo a passo' }, [
      el('button', { type: 'button', classe: etapa == null ? 'ativo' : '', texto: 'Inteiro', onclick: () => cartaoDoModulo(mod, null) }),
      ...etapas.map((e, i) => el('button', { type: 'button', classe: etapa === e ? 'ativo' : '', texto: `${i + 1}. ${nomeEtapa(e)}`, onclick: () => cartaoDoModulo(mod, e) })),
    ])
    const pecas = (mod.pecas || []).filter((p) => etapa == null || p.e === etapa)
    const lista = pecas.length
      ? pecas.map((p) => el('button', { classe: 'linha', type: 'button', onclick: () => { fecharCartao(); selecionar(mod, p.nos?.length ? p.nos : [], p, p.nos?.[0]); centralizar() } }, [
          el('span', { classe: 'n', texto: `${p.q}×` }),
          el('span', { classe: 't' }, [el('b', { texto: p.nome }), el('span', { texto: [medida(p), p.mat, p.c].filter(Boolean).join(' · ') })]),
        ]))
      : [el('div', { classe: 'aviso-peq', texto: (mod.pecas || []).length ? 'Nenhuma peça desta etapa tem etiqueta.' : 'As peças deste módulo ainda não têm etiqueta.' })]
    const sub = [mod.ordem != null ? `${mod.ordem}º a instalar` : null, NIVEL[mod.nivel] || null].filter(Boolean).join(' · ')
    abrirCartao([
      el('h2', { texto: nomeMod(mod) }),
      sub ? el('p', { classe: 'sub', texto: sub }) : null,
      mod.encosto && mod.encosto !== '—' ? el('p', { classe: 'sub', texto: `Encosta em: ${mod.encosto}` }) : null,
      mod.motivo ? el('p', { classe: 'sub', texto: mod.motivo }) : null,
      pilha, ...lista,
    ], 'modulo')
  }

  function cartaoDaPeca(mod, peca, outras = [], noBase = null) {
    if (peca) selecionar(mod, peca.nos?.length ? peca.nos : [], peca, peca.nos?.[0])
    const i = info.get(noBase || peca?.nos?.[0])
    abrirCartao([
      el('div', { classe: 'peca-destaque' }, [el('div', { classe: 'cod', texto: peca ? `Peça ${peca.c}` : 'Peça sem etiqueta' }), el('h2', { texto: peca?.nome || i?.nome || 'Peça' })]),
      el('dl', { classe: 'grade' }, [
        el('dt', { texto: 'Módulo' }), el('dd', { texto: nomeMod(mod) }),
        el('dt', { texto: 'Medida' }), el('dd', { texto: peca ? `${medida(peca)} mm` : `${medidaDaMalha(mod, noBase) || '—'} mm` }),
        peca?.mat ? el('dt', { texto: 'Material' }) : null, peca?.mat ? el('dd', { texto: peca.mat }) : null,
        peca ? el('dt', { texto: 'Quantidade' }) : null, peca ? el('dd', { texto: `${peca.q} neste módulo` }) : null,
        el('dt', { texto: 'Etapa' }), el('dd', { texto: nomeEtapa(peca?.e ?? i?.etapa) }),
        mod.ordem != null ? el('dt', { texto: 'Instalação' }) : null, mod.ordem != null ? el('dd', { texto: `${mod.ordem}º módulo` }) : null,
      ]),
      peca && !(peca.nos || []).length ? el('div', { classe: 'aviso-peq', texto: 'A peça não foi achada sozinha no 3D: veja o módulo e a etapa dela.' }) : null,
      outras.length ? el('div', { classe: 'aviso-peq', texto: `Esta peça também vai em: ${outras.map((o) => rotMod(o.modulo)).join(', ')}.` }) : null,
      ...outras.map((o) => el('button', { classe: 'linha', type: 'button', onclick: () => cartaoDaPeca(o.modulo, o.peca, []) }, [
        el('span', { classe: 'n', texto: rotMod(o.modulo) }), el('span', { classe: 't' }, [el('b', { texto: o.modulo.nome }), el('span', { texto: `${o.peca.q}× nesta` })]),
      ])),
      el('div', { classe: 'pilha' }, [el('button', { type: 'button', texto: 'Ver o módulo e o passo a passo', onclick: () => cartaoDoModulo(mod) })]),
    ], 'peca')
  }

  function acharPorCodigo(texto) {
    const c = lerCodigo(texto)
    if (!c) return null
    const oc = []
    for (const m of D.modulos) { const p = (m.pecas || []).find((x) => x.c === c); if (p) oc.push({ modulo: m, peca: p }) }
    return { c, oc }
  }
  function abrirCodigo(texto) {
    const r = acharPorCodigo(texto)
    if (!r) { abrirCartao([el('h2', { texto: 'Não é um código de peça' }), el('p', { classe: 'sub', texto: 'Leia o QR da etiqueta colada na peça.' })]); return }
    if (!r.oc.length) { abrirCartao([el('h2', { texto: `Peça ${r.c}` }), el('p', { classe: 'sub', texto: 'Esta peça não está neste projeto — confira se a etiqueta é desta obra.' })]); return }
    const [prim, ...resto] = r.oc
    E.foco = null
    cartaoDaPeca(prim.modulo, prim.peca, resto)
    centralizar()
  }

  // ─── Exibição: vista, montagem e camadas ───
  function folhaExibicao() {
    const seg = (opcoes, atual, aoEscolher) => el('div', { classe: 'seg', role: 'group' },
      opcoes.map(([id, rot]) => el('button', { type: 'button', 'aria-pressed': String(id === atual), texto: rot, onclick: () => { aoEscolher(id); folhaExibicao() } })))
    const linhaCamada = (id, rot, extra = '') => {
      const ligado = E.camadas[id] !== false
      return el('div', { classe: ligado ? 'no' : 'no oculto' }, [
        el('button', { classe: 'olho', type: 'button', 'aria-pressed': String(ligado), 'aria-label': `${ligado ? 'Esconder' : 'Mostrar'} ${rot}`,
          onclick: () => { E.camadas[id] = !ligado; aplicar(); folhaExibicao() } }, [icone(ligado ? OLHO : OLHO_FECHADO)]),
        el('button', { classe: 'rot', type: 'button', onclick: () => { E.camadas[id] = !ligado; aplicar(); folhaExibicao() } }, [rot, extra ? el('small', { texto: extra }) : null]),
      ])
    }
    const totalFuros = D.modulos.reduce((s, m) => s + (m.furos?.quantidade || 0), 0)
    abrirCartao([
      el('h2', { texto: 'Exibição' }),
      el('h3', { texto: 'Vista' }),
      seg([['solido', 'Sólida'], ['raiox', 'Raio-X']], E.modo, (id) => { E.modo = id; if (id === 'raiox') criarArestas(); aplicar() }),
      el('h3', { texto: 'Montagem' }),
      seg([['normal', 'Normal'], ['explodido', 'Explodida']], E.explodido ? 'explodido' : 'normal', (id) => explodir(id === 'explodido')),
      el('h3', { texto: 'Camadas' }),
      ...(D.camadas || CLASSES_PADRAO).map((c) => linhaCamada(c.id, c.nome)),
      linhaCamada('furos', 'Furos', totalFuros ? `${totalFuros} furos de cavilha, parafuso, copa e pitão` : 'Este projeto não tem furos no arquivo'),
      linhaCamada('rotulos', 'Legendas', 'O código da etiqueta sobre cada peça (M1, M2… no projeto inteiro)'),
    ], 'exibicao')
  }

  // ─── Estrutura: Peças / Módulos / Projeto ───
  const est = { aba: 'projeto', filtro: '', abertos: new Set() }
  const semAcento = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
  function alternarOculto(nome) { if (E.ocultos.has(nome)) E.ocultos.delete(nome); else E.ocultos.add(nome); aplicar(); folhaEstrutura() }
  function linhaNo({ nome, rot, sub, seta = null, aoTocar, nivel = 0 }) {
    const oculto = E.ocultos.has(nome)
    const selec = E.sel.includes(nome)
    return el('div', { classe: ['no', oculto ? 'oculto' : '', selec ? 'sel' : ''].join(' ').trim(), style: nivel ? `padding-left:${nivel * 22}px` : null }, [
      el('button', { classe: 'olho', type: 'button', 'aria-pressed': String(!oculto), 'aria-label': `${oculto ? 'Mostrar' : 'Esconder'} ${rot}`, onclick: () => alternarOculto(nome) }, [icone(oculto ? OLHO_FECHADO : OLHO)]),
      seta ? el('button', { classe: 'seta', type: 'button', 'aria-label': seta.aberto ? 'Fechar' : 'Abrir', 'aria-expanded': String(seta.aberto), onclick: seta.alternar }, [icone(seta.aberto ? SETA_B : SETA_D)]) : null,
      el('button', { classe: 'rot', type: 'button', onclick: aoTocar }, [rot, sub ? el('small', { texto: sub }) : null]),
    ])
  }
  function pecasDoModulo(mod) {
    // As peças (não as ferragens) na ordem do 3D, com o código quando a etiqueta casou.
    return (mod.nos || []).filter((n) => n.cl !== 'ferragem' && porNome.has(n.no)).map((n) => ({ ...n, peca: pecaDoNo.get(n.no) || null }))
  }
  const textoDaPeca = (mod, n) => [n.peca?.c, n.nome || n.peca?.nome, rotMod(mod), mod.nome].filter(Boolean).join(' ')
  function folhaEstrutura() {
    const f = semAcento(est.filtro)
    const bate = (t) => !f || semAcento(t).includes(f)
    const abas = el('div', { classe: 'seg', role: 'tablist' }, [['pecas', 'Peças'], ['modulos', 'Módulos'], ['projeto', 'Projeto']].map(([id, rot]) =>
      el('button', { type: 'button', role: 'tab', 'aria-pressed': String(est.aba === id), texto: rot, onclick: () => { est.aba = id; folhaEstrutura() } })))
    const campo = el('input', { type: 'search', inputmode: 'search', placeholder: 'Filtrar: código da etiqueta, peça ou módulo', 'aria-label': 'Filtrar estrutura', value: est.filtro })
    campo.addEventListener('input', () => { est.filtro = campo.value; const pos = campo.selectionStart; folhaEstrutura(); const c = cartao.querySelector('input'); if (c) { c.focus(); try { c.setSelectionRange(pos, pos) } catch { /* nada */ } } })
    campo.addEventListener('keydown', (e) => { if (e.key === 'Enter' && acharPorCodigo(campo.value)?.oc.length) abrirCodigo(campo.value) })
    const linhas = []
    const tocarPeca = (mod, n) => () => { selecionarMalha(n.no); centralizar(); folhaEstrutura() }
    if (est.aba === 'pecas') {
      for (const mod of D.modulos) for (const n of pecasDoModulo(mod)) {
        if (!bate(textoDaPeca(mod, n))) continue
        linhas.push(linhaNo({ nome: n.no, rot: `${n.peca?.c ? `${n.peca.c} · ` : ''}${n.nome || n.peca?.nome || 'Peça'}`,
          sub: [rotMod(mod), n.peca ? `${medida(n.peca)} mm` : (medidaDaMalha(mod, n.no) ? `${medidaDaMalha(mod, n.no)} mm` : ''), n.peca?.mat].filter(Boolean).join(' · '), aoTocar: tocarPeca(mod, n) }))
        if (linhas.length >= 300) break
      }
    } else if (est.aba === 'modulos') {
      for (const mod of D.modulos) {
        if (!bate(`${rotMod(mod)} ${mod.nome}`)) continue
        linhas.push(linhaNo({ nome: mod.no, rot: `${mod.ordem != null ? `${mod.ordem}º · ` : ''}${nomeMod(mod)}`,
          sub: [NIVEL[mod.nivel], `${pecasDoModulo(mod).length} peças`].filter(Boolean).join(' · '), aoTocar: () => cartaoDoModulo(mod) }))
      }
    } else {
      linhas.push(el('div', { classe: 'aviso-peq', texto: `${D.projeto} — ${D.modulos.length} módulos, na ordem de instalação. Toque no módulo para o passo a passo; no olho para esconder.` }))
      for (const mod of D.modulos) {
        const pecas = pecasDoModulo(mod).filter((n) => bate(textoDaPeca(mod, n)))
        if (f && !pecas.length && !bate(`${rotMod(mod)} ${mod.nome}`)) continue
        const aberto = est.abertos.has(mod.no) || (!!f && pecas.length > 0)
        linhas.push(linhaNo({ nome: mod.no, rot: nomeMod(mod), sub: mod.ordem != null ? `${mod.ordem}º a instalar · ${pecasDoModulo(mod).length} peças` : null,
          seta: { aberto, alternar: () => { if (est.abertos.has(mod.no)) est.abertos.delete(mod.no); else est.abertos.add(mod.no); folhaEstrutura() } },
          aoTocar: () => cartaoDoModulo(mod) }))
        if (aberto) for (const n of pecas) linhas.push(linhaNo({ nome: n.no, nivel: 1, rot: `${n.peca?.c ? `${n.peca.c} · ` : ''}${n.nome || n.peca?.nome || 'Peça'}`, aoTocar: tocarPeca(mod, n) }))
      }
    }
    const rolagem = folhaAtual === 'estrutura' ? cartao.scrollTop : 0
    abrirCartao([
      el('h2', { texto: 'Estrutura' }), abas, el('div', { classe: 'busca' }, [campo]),
      E.ocultos.size ? el('div', { classe: 'pilha' }, [el('button', { type: 'button', texto: `Mostrar tudo (${E.ocultos.size} escondidos)`, onclick: () => { E.ocultos.clear(); aplicar(); folhaEstrutura() } })]) : null,
      ...(linhas.length ? linhas : [el('div', { classe: 'aviso-peq', texto: 'Nada com esse filtro.' })]),
    ], 'estrutura')
    cartao.scrollTop = rolagem
  }

  // ─── montagem animada (um passo por vez; para no fim) ───
  let tocando = null
  function pararMontagem() {
    clearTimeout(tocando); tocando = null
    $('r-play').setAttribute('aria-pressed', 'false')
    if (E.ateModulo != null) { E.ateModulo = null; aplicar() }
  }
  function montagemAnimada() {
    if (tocando) { pararMontagem(); return }
    $('r-play').setAttribute('aria-pressed', 'true')
    if (E.foco || E.selMod) {
      // Um módulo: as etapas dele, uma a uma.
      const mod = E.foco?.mod || E.selMod
      const etapas = Object.keys(mod.etapas || {}).map(Number).sort((a, b) => a - b)
      let k = 0
      E.sel = []; $('hud').classList.remove('aberto')
      const passo = () => {
        if (k >= etapas.length) { E.foco = { mod, etapa: null }; aplicar(); tocando = null; $('r-play').setAttribute('aria-pressed', 'false'); return }
        E.foco = { mod, etapa: etapas[k++] }; aplicar()
        tocando = setTimeout(passo, 1100)
      }
      enquadrar([porNome.get(mod.no)]); passo()
    } else {
      // O projeto: os módulos entram na ordem de instalação.
      let k = 0
      const passo = () => {
        if (k >= D.modulos.length) { pararMontagem(); return }
        E.ateModulo = k++; aplicar()
        // Uns 12 s no total, qualquer que seja o número de módulos.
        tocando = setTimeout(passo, Math.max(150, Math.min(700, 12000 / D.modulos.length)))
      }
      enquadrar([raiz]); passo()
    }
  }

  function vistaInicial() {
    pararMontagem(); if (E.explodido) explodir(false)
    E.foco = null; E.ocultos.clear(); tirarSelecao(); fecharCartao(); enquadrar([raiz])
  }

  // ─── leitura do QR da etiqueta (câmera só enquanto a janela está aberta) ───
  let fluxo = null, lendo = false, detector = null
  async function carregarJsQR() {
    if (window.jsQR) return window.jsQR
    await new Promise((ok, erro) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'; s.onload = ok; s.onerror = erro; document.head.append(s) })
    return window.jsQR
  }
  async function abrirCamera() {
    $('camera').classList.add('aberto')
    $('camera-texto').textContent = 'Aponte para o QR da etiqueta da peça'
    try {
      fluxo = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
    } catch {
      $('camera-texto').textContent = 'Sem acesso à câmera. Libere a câmera para esta página ou use "Estrutura" e digite o código da etiqueta.'
      return
    }
    const video = $('video'); video.srcObject = fluxo; await video.play().catch(() => {})
    if ('BarcodeDetector' in window) { try { detector = new window.BarcodeDetector({ formats: ['qr_code'] }) } catch { detector = null } }
    const jsqr = detector ? null : await carregarJsQR().catch(() => null)
    const tela = document.createElement('canvas'), ctx = tela.getContext('2d', { willReadFrequently: true })
    lendo = true
    const passo = async () => {
      if (!lendo) return
      let texto = null
      try {
        if (detector) { const r = await detector.detect(video); texto = r?.[0]?.rawValue || null }
        else if (jsqr && video.videoWidth) {
          const w = Math.min(640, video.videoWidth), h = Math.round(w * video.videoHeight / video.videoWidth)
          tela.width = w; tela.height = h; ctx.drawImage(video, 0, 0, w, h)
          texto = jsqr(ctx.getImageData(0, 0, w, h).data, w, h)?.data || null
        }
      } catch { texto = null }
      if (texto && lerCodigo(texto)) { fecharCamera(); navigator.vibrate?.(60); abrirCodigo(texto); return }
      setTimeout(passo, 180)
    }
    passo()
  }
  function fecharCamera() {
    lendo = false
    fluxo?.getTracks().forEach((t) => t.stop()); fluxo = null
    $('camera').classList.remove('aberto')
  }
  $('b-fechar-camera').addEventListener('click', fecharCamera)

  // ─── toque no 3D: escolhe a PEÇA (toque no vazio tira a seleção) ───
  const raio = new THREE.Raycaster(), ponto = new THREE.Vector2()
  let inicio = null
  canvas.addEventListener('pointerdown', (e) => { inicio = { x: e.clientX, y: e.clientY } })
  canvas.addEventListener('pointerup', (e) => {
    if (!inicio || Math.hypot(e.clientX - inicio.x, e.clientY - inicio.y) > 8 || !D) return
    const r = canvas.getBoundingClientRect()
    ponto.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1)
    raio.setFromCamera(ponto, camera)
    const hit = raio.intersectObject(raiz, true).find((h) => h.object.isMesh && h.object.visible && ehPeca(h.object.name)
      && (!E.foco || moduloDe(h.object)?.name === E.foco.mod.no))
    if (!hit) { if (E.sel.length) tirarSelecao(); return }
    if (folhaAtual && folhaAtual !== 'estrutura') fecharCartao()
    selecionarMalha(hit.object.name)
    if (folhaAtual === 'estrutura') folhaEstrutura()
  })

  /** Abre o pacote (o teste no Ardus chama direto, sem servidor). */
  window.abrirObra = async function abrirObra(buffer, meta = {}) {
    const gltf = await new GLTFLoader().parseAsync(buffer, '')
    raiz = gltf.scene
    raiz.traverse((o) => { if (o.userData?.montagem && !D) D = o.userData.montagem; if (o.name) porNome.set(o.name, o) })
    if (!D) throw new Error('O arquivo não tem os dados da montagem.')
    D.modulos.forEach((mod, k) => { mod._idx = k })
    // Malha -> módulo, nome, camada, etapa e dono; e a peça da etiqueta.
    for (const mod of D.modulos) {
      const etapaDoNo = new Map()
      for (const [e, lista] of Object.entries(mod.etapas || {})) for (const n of lista) etapaDoNo.set(n, Number(e))
      const daMalha = new Map((mod.nos || []).map((n) => [n.no, n]))
      const lista = []
      const o = porNome.get(mod.no)
      if (o) todasAsMalhas(o, (m) => {
        const n = daMalha.get(m.name) || {}
        info.set(m.name, { mod, nome: n.nome || null, cl: n.cl || 'caixa', dono: n.dono || null, etapa: etapaDoNo.get(m.name) ?? null })
        lista.push(m)
      })
      malhasDoModulo.set(mod, lista)
      for (const p of mod.pecas || []) for (const n of p.nos || []) pecaDoNo.set(n, p)
      const furos = mod.furos?.no ? porNome.get(mod.furos.no) : null
      if (furos) furos.visible = false
    }
    todasAsMalhas(raiz, (m) => original.set(m, m.material))
    cena.add(raiz)
    $('projeto').textContent = meta.nome || D.projeto
    document.title = `${meta.nome || D.projeto} — 3D da obra`
    $('empresa').textContent = [meta.empresa || D.empresa, D.pedido ? `Pedido ${D.pedido}` : null].filter(Boolean).join(' · ')
    $('progresso')?.remove()
    $('barra').hidden = false; $('dica').hidden = false; $('redondos').hidden = false
    setTimeout(() => { const d = $('dica'); if (d) d.hidden = true }, 5000)
    ajustar(); aplicar(); enquadrar([raiz])
    $('b-ler').onclick = abrirCamera
    $('b-exibicao').onclick = () => (folhaAtual === 'exibicao' ? fecharCartao() : folhaExibicao())
    $('b-estrutura').onclick = () => (folhaAtual === 'estrutura' ? fecharCartao() : folhaEstrutura())
    $('r-centro').onclick = centralizar
    $('r-cima').onclick = () => enquadrar(E.foco ? [porNome.get(E.foco.mod.no)] : [raiz], { deCima: true })
    $('r-play').onclick = montagemAnimada
    $('r-inicio').onclick = vistaInicial
    return { modulos: D.modulos.length, pecas: D.resumo?.pecas || 0, malhas: info.size }
  }
  window.__obra = {
    abrirCodigo, cartaoDoModulo: (i) => cartaoDoModulo(D.modulos[i]), dados: () => D, estado: () => E,
    exibicao: folhaExibicao, estrutura: folhaEstrutura, explodir, selecionarMalha, montagemAnimada, vistaInicial,
    raiox: (s = true) => { E.modo = s ? 'raiox' : 'solido'; if (s) criarArestas(); aplicar() },
    camada: (id, v) => { E.camadas[id] = v; aplicar() },
  }

  async function iniciar() {
    ajustar()
    const id = new URLSearchParams(location.search).get('m') || ''
    if (!id && window.__semServidor) return
    if (!UUID.test(id)) return aviso('Link incompleto', 'Abra o link ou o QR que você recebeu, sem cortar o final do endereço.')
    let dadosDoLink = null
    try {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/montagem_publica`, {
        method: 'POST', headers: { apikey: CHAVE_PUBLICAVEL, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_id: id }),
      })
      if (!r.ok) throw new Error(String(r.status))
      dadosDoLink = await r.json()
    } catch { return aviso('Sem conexão', 'Não foi possível carregar a obra agora. Confira a internet e tente de novo.') }
    if (!dadosDoLink || !dadosDoLink.arquivo) return aviso('Este link não está mais disponível', 'Ele venceu ou foi desligado. Peça um link novo a quem enviou o projeto.')
    if (typeof dadosDoLink.logo === 'string' && dadosDoLink.logo.startsWith('data:image/')) { $('logo').src = dadosDoLink.logo; $('logo').style.display = 'block' }
    try {
      const versao = encodeURIComponent(dadosDoLink.atualizado_em || '')
      const resp = await fetch(`${SUPABASE_URL}/storage/v1/object/public/vistas/${dadosDoLink.arquivo}?v=${versao}`)
      if (!resp.ok) throw new Error(String(resp.status))
      $('progresso') && ($('progresso').textContent = 'Abrindo o 3D…')
      await window.abrirObra(await resp.arrayBuffer(), { nome: dadosDoLink.nome, empresa: dadosDoLink.empresa })
    } catch { aviso('Não foi possível abrir o 3D', 'O arquivo da obra não carregou. Peça a quem enviou para gerar as etiquetas (ou o link) de novo.') }
  }
  iniciar()
</script>
</body>
